name: Build

on:
  push:
    branches: [main, arena/dd905c59-havoc]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Check console layout
        run: |
          mkdir -p build/layout-tests
          javac -d build/layout-tests src/main/java/havoc/screen/library/LibraryLayout.java src/main/java/havoc/screen/library/CarouselMotion.java tests/java/LibraryLayoutTest.java tests/java/CarouselMotionTest.java
          java -cp build/layout-tests LibraryLayoutTest
          java -cp build/layout-tests CarouselMotionTest
      - name: Check UI and shader resources
        run: python3 -m unittest discover -s tests -v
      - name: Report Java compiler errors
        run: echo "::add-matcher::.github/javac-matcher.json"
      - name: Build and check
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload built jars
        uses: actions/upload-artifact@v4
        with:
          name: havoc-jars
          path: build/libs/*.jar
          if-no-files-found: error
